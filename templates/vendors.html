{% extends 'base.html' %}{% block content %}<section class="card"><h2>Vendors</h2><form id="vendor-form" class="grid-2"><input type="hidden" id="vendor-id"><div><label>Name</label><input id="v-name" required></div><div><label>Mobile</label><input id="v-mobile"></div><div class="span-2"><label>Address</label><input id="v-address"></div><div class="actions span-2"><button type="submit">Save</button><button type="button" id="vendor-reset" class="secondary">Reset</button></div></form></section><section class="card"><h3>Vendor List</h3><table id="vendors-table"></table></section><script>
async function fetchVendors(){ const r=await fetch('/api/vendors/'); const j=await r.json(); return j.results; }
function row(v){ return `<tr><td>${v.name}</td><td>${v.mobile_number||''}</td><td>${v.address||''}</td><td class="right"><button onclick="editVendor(${v.id})">Edit</button><button class="danger" onclick="delVendor(${v.id})">Delete</button></td></tr>`}
async function render(){ const data=await fetchVendors(); const head='<tr><th>Name</th><th>Mobile</th><th>Address</th><th></th></tr>'; document.querySelector('#vendors-table').innerHTML=head+data.map(row).join(''); }
async function editVendor(id){ const r=await fetch('/api/vendors/'+id+'/'); const v=await r.json(); document.querySelector('#vendor-id').value=v.id; document.querySelector('#v-name').value=v.name; document.querySelector('#v-mobile').value=v.mobile_number||''; document.querySelector('#v-address').value=v.address||''; }
async function delVendor(id){ if(!confirm('Delete vendor?')) return; await fetch('/api/vendors/'+id+'/', {method:'DELETE'}); render(); }
document.querySelector('#vendor-reset').onclick=()=>{ document.querySelector('#vendor-form').reset(); document.querySelector('#vendor-id').value=''; }
document.querySelector('#vendor-form').onsubmit=async (e)=>{ e.preventDefault(); const id=document.querySelector('#vendor-id').value; const payload={name:document.querySelector('#v-name').value, mobile_number:document.querySelector('#v-mobile').value, address:document.querySelector('#v-address').value}; if(id) await fetch('/api/vendors/'+id+'/', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); else await fetch('/api/vendors/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); document.querySelector('#vendor-form').reset(); document.querySelector('#vendor-id').value=''; render(); }
render();
</script>{% endblock %}
