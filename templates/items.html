{% extends 'base.html' %}{% block content %}<section class="card"><h2>Items</h2><form id="item-form" class="grid-3"><input type="hidden" id="item-id"><div><label>Name</label><input id="i-name" required></div><div><label>Unit</label><input id="i-unit" value="Kg"></div><div><label>Vendor</label><select id="i-vendor"></select></div><div class="actions span-3"><button type="submit">Save</button><button type="button" id="item-reset" class="secondary">Reset</button></div></form></section><section class="card"><h3>Item List</h3><table id="items-table"></table></section><script>
async function getVendors(){const r=await fetch('/api/vendors/');return (await r.json()).results;}
async function getItems(){const r=await fetch('/api/items/');return (await r.json()).results;}
async function fillVendorSelect(){const vendors=await getVendors(); const s=document.querySelector('#i-vendor'); s.innerHTML=vendors.map(v=>`<option value="${v.id}">${v.name} (${v.mobile_number||''})</option>`).join('');}
function itemRow(i){return `<tr><td>${i.name}</td><td>${i.unit}</td><td>${i.vendor.name}</td><td class="right"><button onclick="editItem(${i.id})">Edit</button><button class="danger" onclick="delItem(${i.id})">Delete</button></td></tr>`;}
async function render(){await fillVendorSelect(); const items=await getItems(); const head='<tr><th>Name</th><th>Unit</th><th>Vendor</th><th></th></tr>'; document.querySelector('#items-table').innerHTML=head+items.map(itemRow).join('');}
async function editItem(id){const r=await fetch('/api/items/'+id+'/'); const it=await r.json(); document.querySelector('#item-id').value=it.id; document.querySelector('#i-name').value=it.name; document.querySelector('#i-unit').value=it.unit; document.querySelector('#i-vendor').value=it.vendor_id;}
async function delItem(id){ if(!confirm('Delete item?')) return; await fetch('/api/items/'+id+'/', {method:'DELETE'}); render(); }
document.querySelector('#item-reset').onclick=()=>{document.querySelector('#item-form').reset(); document.querySelector('#item-id').value='';}
document.querySelector('#item-form').onsubmit=async (e)=>{e.preventDefault(); const id=document.querySelector('#item-id').value; const payload={name:document.querySelector('#i-name').value, unit:document.querySelector('#i-unit').value, vendor_id:document.querySelector('#i-vendor').value}; if(id) await fetch('/api/items/'+id+'/', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); else await fetch('/api/items/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); document.querySelector('#item-form').reset(); document.querySelector('#item-id').value=''; render();}
render();
</script>{% endblock %}
