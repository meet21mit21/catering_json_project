{% extends 'base.html' %}{% block content %}<section class="card"><h2>Create / Edit Event</h2><form id="event-form" class="grid-4"><input type="hidden" id="e-id"><div><label>Name</label><input id="e-name" required></div><div><label>Date</label><input id="e-date" type="date" required></div><div><label>Persons</label><input id="e-persons" type="number" value="100"></div><div><label>Add Dish</label><select id="e-dish"></select></div><div class="span-4"><div class="chips" id="dish-chips"></div></div><div class="span-4"><h3>Direct Items</h3></div><div><label>Item</label><select id="dir-item"></select></div><div><label>Quantity</label><input id="dir-qty" placeholder="e.g. 5"></div><div><label>&nbsp;</label><button type="button" id="add-dir">Add</button></div><div></div><div class="span-4"><table id="dir-table"></table></div><div class="actions span-4"><button type="submit">Save</button><button type="button" id="event-reset" class="secondary">Reset</button></div></form></section><section class="card"><h3>Events</h3><table id="events-table"></table></section><script>
let chosenDishes=[]; let directItems=[];
async function getDishes(){const r=await fetch('/api/dishes/'); return (await r.json()).results;}
async function getItems(){const r=await fetch('/api/items/'); return (await r.json()).results;}
async function getEvents(){const r=await fetch('/api/events/'); return (await r.json()).results;}
async function fillDishSelect(){const dishes=await getDishes(); const s=document.querySelector('#e-dish'); s.innerHTML='<option value="">Select dish</option>'+dishes.map(d=>`<option value="${d.id}">${d.name}</option>`).join(''); s.onchange=()=>{ if(!s.value) return; const id=parseInt(s.value); const name=s.options[s.selectedIndex].text; if(!chosenDishes.find(x=>x.id===id)) chosenDishes.push({id, name}); renderChips(); s.value=''; } }
async function fillItemSelect(){const items=await getItems(); const s=document.querySelector('#dir-item'); s.innerHTML=items.map(i=>`<option value="${i.id}">${i.name} — ${i.vendor.name}</option>`).join('');}
function renderChips(){ document.querySelector('#dish-chips').innerHTML=chosenDishes.map((d,idx)=>`<span class="chip">${d.name}<button onclick="rmDish(${idx})">&times;</button></span>`).join(''); }
function rmDish(i){chosenDishes.splice(i,1); renderChips();}
function renderDir(){ const head='<tr><th>Item</th><th>Qty</th><th></th></tr>'; document.querySelector('#dir-table').innerHTML=head+directItems.map((e,idx)=>`<tr><td>${e.item_name}</td><td>${e.quantity}</td><td class="right"><button class="danger" onclick="rmDir(${idx})">Remove</button></td></tr>`).join('');}
function rmDir(i){ directItems.splice(i,1); renderDir(); }
document.querySelector('#add-dir').onclick=()=>{const s=document.querySelector('#dir-item'); const qty=document.querySelector('#dir-qty').value; if(!qty) return alert('Enter qty'); const id=parseInt(s.value); const name=s.options[s.selectedIndex].text.split(' — ')[0]; directItems.push({item_id:id, item_name:name, quantity:qty}); document.querySelector('#dir-qty').value=''; renderDir();}
async function render(){ await fillDishSelect(); await fillItemSelect(); const events=await getEvents(); const head='<tr><th>Name</th><th>Date</th><th>Persons</th><th></th></tr>'; document.querySelector('#events-table').innerHTML=head+events.map(e=>`<tr><td>${e.name}</td><td>${e.date}</td><td>${e.number_of_persons}</td><td class="right"><a class="button" href="/events/${e.id}/">View</a></td></tr>`).join('');}
document.querySelector('#event-reset').onclick=()=>{document.querySelector('#event-form').reset(); chosenDishes=[]; directItems=[]; renderChips(); renderDir();}
document.querySelector('#event-form').onsubmit=async (e)=>{e.preventDefault(); const payload={name:document.querySelector('#e-name').value, date:document.querySelector('#e-date').value, number_of_persons:parseInt(document.querySelector('#e-persons').value||'100'), dishes:chosenDishes.map(d=>d.id), direct_items:directItems}; await fetch('/api/events/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); document.querySelector('#event-form').reset(); chosenDishes=[]; directItems=[]; renderChips(); renderDir(); render();}
render();
</script>{% endblock %}
